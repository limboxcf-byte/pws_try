<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>fotowiki/ karte</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<!--
Konzept: Alle Bilder mit GPS aus data/manifest.json auf einer Leaflet/OSM-
Karte. Koordinaten stehen bereits fertig im Manifest (beim Build aus EXIF
gelesen) -- kein Nachladen einzelner Bilder noetig. Popup zeigt ein
kleines Vorschaubild (das Originalbild, per CSS verkleinert -- kein
separates Thumbnail-Generieren im Build noetig) und verlinkt auf die
automatisch generierte Einzelseite des jeweiligen Bilds.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0a0a0a; color: #d6d6d0; font-family: "IBM Plex Mono", "Courier New", monospace; font-size: 12px; }
  header { padding: 1rem 1.2rem 0.8rem; border-bottom: 1px solid #2a2a26; display: flex; justify-content: space-between; }
  header a { color: #9a9a8e; text-decoration: none; }
  #karte { height: calc(100vh - 56px); width: 100%; filter: grayscale(0.4) contrast(1.05); }
  .leaflet-popup-content { font-family: "IBM Plex Mono", monospace; font-size: 11px; margin: 8px; }
  .leaflet-popup-content a { color: #1e6e1e; }
  .popup-thumb { display: block; width: 140px; max-width: 100%; height: auto; margin-bottom: 0.4rem; }
  .leaflet-popup-content-wrapper { background: #111; color: #d6d6d0; }
  .leaflet-popup-tip { background: #111; }
</style>
</head>
<body>
<header>
  <div><a href="../">hub</a> / <a href="index.html">fotowiki</a> / karte</div>
  <div style="color:#6b6b62" id="stat">lädt …</div>
</header>
<div id="karte"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
async function ladeJSON(pfad) {
  try {
    const r = await fetch(pfad, { cache: "no-store" });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}

async function init() {
  const manifest = await ladeJSON('data/manifest.json');
  const eintraege = Array.isArray(manifest) ? manifest : [];
  const geotaggt = eintraege.filter(e => typeof e.lat === 'number' && typeof e.lon === 'number');

  document.getElementById('stat').textContent = geotaggt.length + ' / ' + eintraege.length + ' geotaggt';

  const map = L.map('karte').setView([51.2, 9.5], 5.5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap-Mitwirkende',
    maxZoom: 18
  }).addTo(map);

  const markerByDatei = {};
  geotaggt.forEach((e) => {
    const m = L.circleMarker([e.lat, e.lon], {
      radius: 7, color: '#6ea36e', weight: 1, fillColor: '#6ea36e', fillOpacity: 0.5
    }).addTo(map);
    const thumbUrl = 'bilder/' + encodeURIComponent(e.datei);
    m.bindPopup(
      '<img class="popup-thumb" src="' + thumbUrl + '" alt="' + e.datei + '" loading="lazy">' +
      '<strong>' + e.datei + '</strong><br><a href="bild/' + e.slug + '.html">Bild öffnen</a>'
    );
    markerByDatei[e.datei] = m;
  });

  const params = new URLSearchParams(window.location.search);
  const fokus = params.get('fokus');
  if (fokus && markerByDatei[fokus]) {
    const m = markerByDatei[fokus];
    map.setView(m.getLatLng(), 12);
    m.openPopup();
  } else if (geotaggt.length) {
    const gruppe = L.featureGroup(Object.values(markerByDatei));
    map.fitBounds(gruppe.getBounds().pad(0.2));
  }
}

init();
</script>
</body>
</html>
