<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>photo wiki / map</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<!--
Concept: every geotagged image from data/manifest.json on a real
Leaflet/OSM map. Coordinates already sit ready-made in the manifest (read
from EXIF at build time) -- no per-image fetching needed. Popup shows a
small preview (the original image, shrunk via CSS -- no separate
thumbnail-generation step in the build) and links to that image's
auto-generated page.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0a0a0a; color: #d6d6d0; font-family: "IBM Plex Mono", "Courier New", monospace; font-size: 12px; }
  header { padding: 1rem 1.2rem 0.8rem; border-bottom: 1px solid #2a2a26; display: flex; justify-content: space-between; }
  header a { color: #9a9a8e; text-decoration: none; }
  #karte { height: calc(100vh - 56px); width: 100%; filter: grayscale(0.4) contrast(1.05); }
  .leaflet-popup-content { font-family: "IBM Plex Mono", monospace; font-size: 11px; margin: 8px; }
  .leaflet-popup-content a { color: #1e6e1e; }
  .popup-thumb { display: block; width: 140px; max-width: 100%; height: auto; margin-bottom: 0.4rem; }
  .leaflet-popup-content-wrapper { background: #111; color: #d6d6d0; }
  .leaflet-popup-tip { background: #111; }
</style>
</head>
<body>
<header>
  <div><a href="../">home</a> / <a href="index.html">photo wiki</a> / map</div>
  <div style="color:#6b6b62" id="stat">loading …</div>
</header>
<div id="karte"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
async function loadJSON(path) {
  try {
    const r = await fetch(path, { cache: "no-store" });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}

async function init() {
  const manifest = await loadJSON('data/manifest.json');
  const entries = Array.isArray(manifest) ? manifest : [];
  const geotagged = entries.filter(e => typeof e.lat === 'number' && typeof e.lon === 'number');

  document.getElementById('stat').textContent = geotagged.length + ' / ' + entries.length + ' geotagged';

  const map = L.map('karte').setView([51.2, 9.5], 5.5);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors',
    maxZoom: 18
  }).addTo(map);

  const markerByFile = {};
  geotagged.forEach((e) => {
    const m = L.circleMarker([e.lat, e.lon], {
            radius: 7, color: '#ff3b30', weight: 1, fillColor: '#ff3b30', fillOpacity: 0.55
    }).addTo(map);
    const thumbUrl = 'bilder/' + encodeURIComponent(e.file);
    m.bindPopup(
      '<img class="popup-thumb" src="' + thumbUrl + '" alt="' + e.file + '" loading="lazy">' +
      '<strong>' + e.file + '</strong><br><a href="bild/' + e.slug + '.html">Open image</a>'
    );
    markerByFile[e.file] = m;
  });

  const params = new URLSearchParams(window.location.search);
  const focus = params.get('fokus');
  if (focus && markerByFile[focus]) {
    const m = markerByFile[focus];
    map.setView(m.getLatLng(), 12);
    m.openPopup();
  } else if (geotagged.length) {
    const group = L.featureGroup(Object.values(markerByFile));
    map.fitBounds(group.getBounds().pad(0.2));
  }
}

init();
</script>
</body>
</html>
