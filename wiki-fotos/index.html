<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>photo wiki /</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
Concept: automatic camera-roll grid. All metadata (EXIF, slug) already
sits ready-made in data/manifest.json -- written at build time by
scripts/build-fotowiki.js, not computed in the browser. Every image links
to its own, likewise auto-generated page under bild/<slug>.html.
Tags/related images come from data/tags.json (editable on-page or by hand).
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0a0a0a; color: #d6d6d0; font-family: "IBM Plex Mono", "Courier New", monospace; font-size: 12px; }
  header { padding: 1rem 1.2rem 0.8rem; border-bottom: 1px solid #2a2a26; display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0.5rem; }
  header .pfad { color: #6b6b62; }
  header .pfad a { color: #9a9a8e; text-decoration: none; }
  nav.filter { padding: 0.6rem 1.2rem; border-bottom: 1px solid #2a2a26; font-size: 11px; }
  nav.filter a { color: #9a9a8e; text-decoration: none; margin-right: 1rem; }
  .stat { padding: 0.5rem 1.2rem; color: #4d4d46; font-size: 11px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1px; background: #1a1a17; padding: 1px; }
  .cell { background: #111; text-decoration: none; color: #d6d6d0; display: block; }
  .thumb { aspect-ratio: 1; overflow: hidden; background: #161614; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .meta { padding: 0.4rem 0.5rem 0.6rem; font-size: 10.5px; color: #8a8a80; line-height: 1.5; }
  .meta .id { color: #c9c9bd; word-break: break-all; }
  .meta .geo { color: #6ea36e; }
  .leer { padding: 3rem 1.5rem; color: #6b6b62; max-width: 46ch; line-height: 1.7; }
  .leer code { color: #9a9a8e; }
  footer { padding: 1.2rem; font-size: 11px; color: #6b6b62; border-top: 1px solid #2a2a26; margin-top: 1px; }
  footer a { color: #9a9a8e; }
</style>
</head>
<body>
<header>
  <div class="pfad"><a href="../">home</a> / photo wiki / camera roll</div>
  <div class="pfad" id="stat2"></div>
</header>
<nav class="filter">
  <a href="karte.html">→ map view</a>
</nav>
<div class="stat" id="stat">loading manifest …</div>
<div class="grid" id="grid"></div>
<div class="leer" id="leer" style="display:none">
  No images yet. Drop JPEG/PNG files into <code>wiki-fotos/bilder/</code>
  and push -- the Action generates the manifest and individual pages
  automatically.
</div>
<footer><a href="../">← back to home</a></footer>

<script>
async function loadJSON(path) {
  try {
    const r = await fetch(path, { cache: "no-store" });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}

function formatShortDate(iso) {
  if (!iso) return null;
  const dt = new Date(iso);
  if (isNaN(dt)) return null;
  const p = n => String(n).padStart(2,'0');
  return dt.getFullYear() + '-' + p(dt.getMonth()+1) + '-' + p(dt.getDate());
}

async function init() {
  const manifest = await loadJSON('data/manifest.json');
  const entries = Array.isArray(manifest) ? manifest.slice() : [];

  document.getElementById('stat').textContent = entries.length + ' object(s) indexed · sorted by date taken';
  document.getElementById('stat2').textContent = 'total: ' + entries.length;

  if (entries.length === 0) {
    document.getElementById('leer').style.display = 'block';
    return;
  }

  entries.sort((a, b) => {
    if (a.date && b.date) return new Date(b.date) - new Date(a.date);
    if (a.date) return -1;
    if (b.date) return 1;
    return a.file.localeCompare(b.file);
  });

  const grid = document.getElementById('grid');
  for (const e of entries) {
    const a = document.createElement('a');
    a.className = 'cell';
    a.href = 'bild/' + e.slug + '.html';

    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const img = document.createElement('img');
    img.src = 'bilder/' + encodeURIComponent(e.file);
    img.loading = 'lazy';
    img.alt = e.file;
    thumb.appendChild(img);

    const meta = document.createElement('div');
    meta.className = 'meta';
    const date = formatShortDate(e.date) || '—';
    const geo = (e.lat && e.lon) ? '<span class="geo">geo ✓</span>' : 'no geo';
    meta.innerHTML = '<span class="id">' + e.file + '</span><br>' + date + (e.aperture ? ' · ' + e.aperture : '') + ' · ' + geo;

    a.appendChild(thumb);
    a.appendChild(meta);
    grid.appendChild(a);
  }
}

init();
</script>
</body>
</html>
