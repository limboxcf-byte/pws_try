<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>fotowiki/</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
Konzept: Automatisches Camera-Roll-Grid. Alle Metadaten (EXIF, Slug) stehen
schon fertig in data/manifest.json -- geschrieben beim Build durch
scripts/build-fotowiki.js, nicht im Browser berechnet. Jedes Bild verlinkt
auf seine eigene, ebenfalls automatisch generierte Seite unter bild/<slug>.html.
Tags/Querverweise kommen aus data/tags.json (Handarbeit).
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0a0a0a; color: #d6d6d0; font-family: "IBM Plex Mono", "Courier New", monospace; font-size: 12px; }
  header { padding: 1rem 1.2rem 0.8rem; border-bottom: 1px solid #2a2a26; display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 0.5rem; }
  header .pfad { color: #6b6b62; }
  header .pfad a { color: #9a9a8e; text-decoration: none; }
  nav.filter { padding: 0.6rem 1.2rem; border-bottom: 1px solid #2a2a26; font-size: 11px; }
  nav.filter a { color: #9a9a8e; text-decoration: none; margin-right: 1rem; }
  .stat { padding: 0.5rem 1.2rem; color: #4d4d46; font-size: 11px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 1px; background: #1a1a17; padding: 1px; }
  .cell { background: #111; text-decoration: none; color: #d6d6d0; display: block; }
  .thumb { aspect-ratio: 1; overflow: hidden; background: #161614; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .meta { padding: 0.4rem 0.5rem 0.6rem; font-size: 10.5px; color: #8a8a80; line-height: 1.5; }
  .meta .id { color: #c9c9bd; word-break: break-all; }
  .meta .geo { color: #6ea36e; }
  .leer { padding: 3rem 1.5rem; color: #6b6b62; max-width: 46ch; line-height: 1.7; }
  .leer code { color: #9a9a8e; }
  footer { padding: 1.2rem; font-size: 11px; color: #6b6b62; border-top: 1px solid #2a2a26; margin-top: 1px; }
  footer a { color: #9a9a8e; }
</style>
</head>
<body>
<header>
  <div class="pfad"><a href="../">hub</a> / fotowiki / camera-roll</div>
  <div class="pfad" id="stat2"></div>
</header>
<nav class="filter">
  <a href="karte.html">→ kartenansicht</a>
</nav>
<div class="stat" id="stat">lädt Manifest …</div>
<div class="grid" id="grid"></div>
<div class="leer" id="leer" style="display:none">
  Noch keine Bilder im Bestand. JPEG/PNG-Dateien in <code>wiki-fotos/bilder/</code>
  ablegen und pushen -- die Action erzeugt Manifest und Einzelseiten automatisch.
</div>
<footer><a href="../">← zurück zum Hub</a></footer>

<script>
async function ladeJSON(pfad) {
  try {
    const r = await fetch(pfad, { cache: "no-store" });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}

function formatKurzdatum(iso) {
  if (!iso) return null;
  const dt = new Date(iso);
  if (isNaN(dt)) return null;
  const p = n => String(n).padStart(2,'0');
  return dt.getFullYear() + '-' + p(dt.getMonth()+1) + '-' + p(dt.getDate());
}

async function init() {
  const manifest = await ladeJSON('data/manifest.json');
  const eintraege = Array.isArray(manifest) ? manifest.slice() : [];

  document.getElementById('stat').textContent = eintraege.length + ' objekt(e) indiziert · sortiert nach aufnahmedatum';
  document.getElementById('stat2').textContent = 'bestand: ' + eintraege.length;

  if (eintraege.length === 0) {
    document.getElementById('leer').style.display = 'block';
    return;
  }

  eintraege.sort((a, b) => {
    if (a.datum && b.datum) return new Date(b.datum) - new Date(a.datum);
    if (a.datum) return -1;
    if (b.datum) return 1;
    return a.datei.localeCompare(b.datei);
  });

  const grid = document.getElementById('grid');
  for (const e of eintraege) {
    const a = document.createElement('a');
    a.className = 'cell';
    a.href = 'bild/' + e.slug + '.html';

    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const img = document.createElement('img');
    img.src = 'bilder/' + encodeURIComponent(e.datei);
    img.loading = 'lazy';
    img.alt = e.datei;
    thumb.appendChild(img);

    const meta = document.createElement('div');
    meta.className = 'meta';
    const datum = formatKurzdatum(e.datum) || '—';
    const geo = (e.lat && e.lon) ? '<span class="geo">geo ✓</span>' : 'kein geo';
    meta.innerHTML = '<span class="id">' + e.datei + '</span><br>' + datum + (e.blende ? ' · ' + e.blende : '') + ' · ' + geo;

    a.appendChild(thumb);
    a.appendChild(meta);
    grid.appendChild(a);
  }
}

init();
</script>
</body>
</html>
