<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Screenshots</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
Concept: a gallery that uses the whole screen -- no grid, no frame, one
image after another. The image list comes from data/manifest.json,
auto-generated by a GitHub Action from screenshots/bilder/ -- drop files
in, push, they appear here without touching any code. Navigation via
arrow keys (desktop) and tap zones left/right (touch). Counter bottom
right, nothing else visible.
-->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #buehne { position: relative; width: 100%; height: 100vh; }
  .bild {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    color: #555;
    font-family: "IBM Plex Mono", "Courier New", monospace;
    font-size: 0.85rem;
    text-align: center;
  }
  .bild.aktiv { display: flex; }
  .bild img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .zone { position: absolute; top: 0; bottom: 0; width: 35%; cursor: pointer; z-index: 5; }
  .zone.links { left: 0; }
  .zone.rechts { right: 0; }
  #zaehler {
    position: absolute; bottom: 1rem; right: 1.2rem;
    color: #777; font-family: "IBM Plex Mono", monospace; font-size: 0.75rem;
    z-index: 10; letter-spacing: 0.05em;
  }
 #datum {
  position: absolute; top: 1rem; right: 1.2rem;
  color: #777; font-family: "IBM Plex Mono", monospace; font-size: 0.72rem;
  z-index: 10; letter-spacing: 0.05em;
}
  #hinweis {
    position: absolute; bottom: 1rem; left: 1.2rem;
    color: #444; font-family: "IBM Plex Mono", monospace; font-size: 0.7rem;
    z-index: 10;
  }
  #zurueck {
    position: absolute; top: 1rem; left: 1.2rem;
    color: #999; font-family: "IBM Plex Mono", monospace; font-size: 0.72rem;
    text-decoration: none; z-index: 10;
    border: 1px solid #333; padding: 0.25rem 0.6rem;
  }
  #zurueck:hover { border-color: #6ea36e; color: #6ea36e; }
  .leer {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #555; font-family: "IBM Plex Mono", monospace; font-size: 0.85rem; text-align: center;
    padding: 2rem; max-width: 40ch; margin: 0 auto;
  }
</style>
</head>
<body>
<a href="../" id="zurueck">← Back to home</a>
<div id="buehne">
  <div id="zaehler" style="display:none">01 / 01</div>
  <div id="datum" style="display:none"></div>
  <div id="hinweis" style="display:none">← → to browse</div>
</div>

<script>
async function loadJSON(path) {
  try {
    const r = await fetch(path, { cache: "no-store" });
    if (!r.ok) return null;
    return await r.json();
  } catch (e) { return null; }
}

async function init() {
  const manifest = await loadJSON('data/manifest.json');
  const files = Array.isArray(manifest) ? manifest : [];
  const stage = document.getElementById('buehne');

  if (files.length === 0) {
    const leer = document.createElement('div');
    leer.className = 'leer';
    leer.textContent = 'No screenshots yet. Drop JPEG/PNG files into screenshots/bilder/ and push -- they appear here automatically.';
    stage.appendChild(leer);
    return;
  }

  files.forEach((file, i) => {
    const div = document.createElement('div');
    div.className = 'bild' + (i === 0 ? ' aktiv' : '');
    const img = document.createElement('img');
    img.src = 'bilder/' + encodeURIComponent(file);
    img.alt = file;
    img.loading = i === 0 ? 'eager' : 'lazy';
    div.appendChild(img);
    stage.insertBefore(div, document.getElementById('zaehler'));
  });

  const zoneL = document.createElement('div');
  zoneL.className = 'zone links';
  zoneL.setAttribute('aria-label', 'previous image');
  const zoneR = document.createElement('div');
  zoneR.className = 'zone rechts';
  zoneR.setAttribute('aria-label', 'next image');
  stage.appendChild(zoneL);
  stage.appendChild(zoneR);

  const bilder = stage.querySelectorAll('.bild');
  let index = 0;
  const zaehler = document.getElementById('zaehler');
  const hinweis = document.getElementById('hinweis');
  const datum = document.getElementById('datum');
  zaehler.style.display = 'block';
  hinweis.style.display = 'block';

    function parseDatum(dateiname) {
    const m = dateiname.match(/Screenshot (\d{4})-(\d{2})-(\d{2}) at (\d{2})\.(\d{2})\.(\d{2})/);
    if (!m) return null;
    const [, y, mo, d, h, mi, s] = m;
    return `${y}-${mo}-${d} · ${h}:${mi}:${s}`;
  }

  function show(i) {
    bilder[index].classList.remove('aktiv');
    index = (i + bilder.length) % bilder.length;
    bilder[index].classList.add('aktiv');
    zaehler.textContent = String(index + 1).padStart(2, '0') + ' / ' + String(bilder.length).padStart(2, '0');
    const gefunden = parseDatum(files[index]);
    datum.textContent = gefunden || '';
    datum.style.display = gefunden ? 'block' : 'none';
  }
  show(0);

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') show(index + 1);
    if (e.key === 'ArrowLeft') show(index - 1);
  });
  zoneL.addEventListener('click', () => show(index - 1));
  zoneR.addEventListener('click', () => show(index + 1));
}

init();
</script>
</body>
</html>
