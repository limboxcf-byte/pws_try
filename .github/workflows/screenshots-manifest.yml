name: screenshots-manifest

on:
  push:
    paths:
      - "screenshots/bilder/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build screenshots manifest
        run: node scripts/build-screenshots.js

      - name: Commit changes
        run: |
          git config user.name "fotowiki-bot"
          git config user.email "actions@users.noreply.github.com"
          git add screenshots/data/manifest.json
          git diff --cached --quiet || git commit -m "screenshots: manifest updated [auto]"
          git push
